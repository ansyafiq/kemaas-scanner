<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeMaAs - Pengimbas Kad Pelajar</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 20px; background: #f3f5f8; color: #212529; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px; border-radius: 14px; background: white; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; color: #0d6efd; font-size: 1.35rem; }
    p { line-height: 1.5; }
    #reader { width: 100%; min-height: 180px; margin: 16px 0; overflow: hidden; border-radius: 10px; background: #111; }
    button { width: 100%; padding: 12px 14px; margin: 5px 0; border: 0; border-radius: 8px; color: #fff; background: #0d6efd; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.secondary { background: #6c757d; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { padding: 10px 12px; border-radius: 8px; background: #eef3f8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .small { color: #6c757d; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>KeMaAs — Pengimbas Kad Pelajar</h1>
    <p>Tekan <b>Mula Kamera</b>, benarkan akses kamera, kemudian halakan kamera pada barcode kad pelajar.</p>
    <div id="status" role="status" aria-live="polite">Sedia untuk mengimbas.</div>
    <div id="reader"></div>
    <button id="startBtn" type="button">Mula Kamera</button>
    <button id="stopBtn" type="button" class="secondary" disabled>Tutup Kamera</button>
    <p class="small">Halaman ini hanya membaca barcode dan menghantar teks barcode kembali ke tab KeMaAs yang membukanya. Ia tidak menyimpan rekod pelajar.</p>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    let scanner = null;
    let scanning = false;
    let alreadySent = false;

    function setStatus(message) { statusEl.textContent = message; }

    function getTrustedParentOrigin() {
      const candidate = new URLSearchParams(window.location.search).get('parentOrigin');
      if (!candidate) return null;
      try {
        const url = new URL(candidate);
        const host = url.hostname.toLowerCase();
        const trustedHost = host === 'script.google.com' || host === 'googleusercontent.com' || host.endsWith('.googleusercontent.com');
        if (url.protocol !== 'https:' || !trustedHost || url.origin !== candidate) return null;
        return url.origin;
      } catch (err) {
        return null;
      }
    }

    const parentOrigin = getTrustedParentOrigin();
    if (!parentOrigin) {
      setStatus('Pautan pembuka tidak sah. Buka pengimbas melalui butang Buka Kamera dalam web app KeMaAs.');
      startBtn.disabled = true;
    }

    async function startScanner() {
      if (scanning || !parentOrigin) return;
      alreadySent = false;
      startBtn.disabled = true;
      setStatus('Meminta kebenaran kamera...');
      try {
        if (!scanner) scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 12, qrbox: { width: 300, height: 140 }, aspectRatio: 1.7 },
          async (decodedText) => {
            if (alreadySent) return;
            alreadySent = true;
            const value = String(decodedText || '').trim();
            if (!value) {
              alreadySent = false;
              return;
            }
            setStatus('Barcode berjaya dibaca. Menghantar nombor ke KeMaAs...');
            try {
              if (scanner && scanner.isScanning) await scanner.stop();
            } catch (stopErr) {
              // Teruskan menghantar hasil imbasan walaupun kamera gagal berhenti dengan segera.
            }
            scanning = false;
            stopBtn.disabled = true;
            startBtn.disabled = false;
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type: 'KEMAAS_BARCODE_SCANNED', value }, parentOrigin);
              setStatus('Imbasan dihantar ke KeMaAs. Anda boleh kembali ke tab KeMaAs.');
              setTimeout(() => window.close(), 700);
            } else {
              setStatus('Tab KeMaAs tidak dijumpai. Barcode dibaca tetapi tidak dapat dihantar. Tutup tab ini dan buka semula scanner dari KeMaAs.');
            }
          },
          () => { /* Abaikan ralat semasa kamera mencari barcode. */ }
        );
        scanning = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        setStatus('Kamera aktif. Halakan pada barcode kad pelajar.');
      } catch (err) {
        scanning = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        const detail = err && err.message ? err.message : String(err);
        setStatus('Kamera tidak dapat dibuka. Semak permission kamera browser dan pastikan halaman dibuka melalui HTTPS.\n\nRalat: ' + detail);
      }
    }

    async function stopScanner() {
      if (scanner && scanner.isScanning) {
        try {
          await scanner.stop();
          setStatus('Kamera ditutup.');
        } catch (err) {
          setStatus('Kamera telah diminta untuk ditutup.');
        }
      }
      scanning = false;
      startBtn.disabled = !parentOrigin;
      stopBtn.disabled = true;
    }

    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    window.addEventListener('beforeunload', () => {
      if (scanner && scanner.isScanning) scanner.stop().catch(() => {});
    });
  </script>
</body>
</html>
